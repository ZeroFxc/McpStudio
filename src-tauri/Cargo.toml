[package]
name = "mcpstudio"
version = "0.1.3"
description = "McpStudio - MCP 集市与路由中心"
authors = ["Nirithy"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mcpstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.8", features = ["v4", "serde"] }

# 桌面端独有依赖（Android 不可用）
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-autostart = "2"
opener = "0.7"
get_if_addrs = "0.5"
rmcp = { path = "./rust-sdk-rmcp/crates/rmcp", features = [
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "client",
] }

# Android 平台依赖（禁用 child-process 传输）
[target.'cfg(target_os = "android")'.dependencies]
rmcp = { path = "./rust-sdk-rmcp/crates/rmcp", features = [
    "transport-io",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "client",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
