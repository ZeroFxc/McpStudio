name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and Release
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          shared-key: mcpstudio-rust

      - name: 编译 Release 版本
        run: cargo build --release
        working-directory: src-tauri

      - name: 生成 MD5 哈希
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release -Filter "mcpstudio.exe" -Recurse | Select-Object -First 1
          if ($exe) {
            $hash = (Get-FileHash -Path $exe.FullName -Algorithm MD5).Hash
            $hash | Out-File -FilePath md5sum.txt -Encoding utf8
            Write-Host "MD5: $hash"
          }

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## McpStudio ${{ github.ref_name }}
            
            **发布日期**: ${{ github.event.repository.updated_at }}
            
            ### 校验值
            ```
            MD5: ${{ hashFiles('md5sum.txt') }}
            ```
            
            ### 安装
            下载 `mcpstudio.exe` 直接运行，无需安装。
          files: |
            src-tauri/target/release/mcpstudio.exe
            md5sum.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}