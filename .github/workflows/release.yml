name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          shared-key: mcpstudio-rust

      - name: 编译 Release 版本
        run: npm run tauri build -- --no-bundle

      - name: 生成 MD5 哈希
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release -Filter "mcpstudio.exe" -Recurse | Select-Object -First 1
          if ($exe) {
            $hash = (Get-FileHash -Path $exe.FullName -Algorithm MD5).Hash
            $hash | Out-File -FilePath md5sum.txt -Encoding utf8
            Write-Host "MD5: $hash"
          }

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/release/mcpstudio.exe
            md5sum.txt

  build-android:
    name: Build Android
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 工具链（含 Android 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          shared-key: mcpstudio-rust-android

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          ndk: 29.0.13004108
          cache: true
          cache-key: android-sdk-36-ndk-29

      - name: 安装前端依赖
        run: npm ci

      - name: 编译 Android APK
        run: |
          $env:ANDROID_NDK_HOME = "$env:ANDROID_SDK_ROOT\ndk\29.0.13004108"
          npm run tauri android build

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    name: 创建 Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: 下载 Android 产物
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: android

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## McpStudio ${{ github.ref_name }}

            ### 下载
            - **Windows**: 下载 `mcpstudio.exe` 直接运行
            - **Android**: 下载 APK 安装到设备

            ### 校验值
            ```
            MD5: ${{ hashFiles('md5sum.txt') }}
            ```
          files: |
            mcpstudio.exe
            md5sum.txt
            android/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}